name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: ด่านตรวจสอบโค้ด (Lint & Test)
  # ==========================================
  test-and-analyze:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        # ข้ามคำเตือนระดับ Info และ Warning เล็กน้อย แต่ยังคงดักจับ Compile Error ทุกชนิด
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ==========================================
  # JOB 2: Build Android APK
  # ==========================================
  build-android:
    name: Build Android App
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # JOB 3: Build Web App
  # ==========================================
  build-web:
    name: Build Web App
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Web Platform
        run: flutter config --enable-web

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web

      - name: Upload Artifact (Web)
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web